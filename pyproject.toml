[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossverse"
version = "0.1.0"
description = "Cross-domain (movies/TV <-> video games) hybrid recommendation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tolga Değirmenci" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "prometheus-client>=0.19",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
web = ["streamlit>=1.30"]
storage = ["psycopg[binary]>=3.1", "redis>=5.0"]
tracking = ["mlflow>=2.10"]
semantic = ["fastembed>=0.4"]  # sentence embeddings on CPU (ONNX runtime, no PyTorch)
dev = ["pytest>=8", "httpx>=0.26", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
crossverse = "crossverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "pipelines", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
