name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossverse
          POSTGRES_PASSWORD: crossverse
          POSTGRES_DB: crossverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crossverse" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      CROSSVERSE_TEST_PG_URL: postgresql://crossverse:crossverse@localhost:5432/crossverse
      CROSSVERSE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,storage]" -c constraints.txt
      - name: Lint
        run: ruff check src tests pipelines apps
      - name: Type-check
        run: mypy src/crossverse --ignore-missing-imports
      - name: Unit + integration tests
        run: pytest -q

  model-gate:
    # End-to-end on the synthetic fixture: build -> train -> evaluate -> gate.
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      CROSSVERSE_TT_EPOCHS: "3"
      CROSSVERSE_ALS_ITERATIONS: "4"
      CROSSVERSE_RANKER_QUERIES_PER_TASK: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . -c constraints.txt
      - run: python pipelines/build_dataset.py --synthetic --synthetic-users 1500
      - run: python pipelines/train.py --version ci --max-eval-cases 300
      - run: python pipelines/evaluate.py --version ci --error-cases 5
      - run: python pipelines/publish.py --version ci
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: reports/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: model-gate
    runs-on: ubuntu-latest
    env:
      CROSSVERSE_TT_EPOCHS: "2"
      CROSSVERSE_ALS_ITERATIONS: "2"
      CROSSVERSE_RANKER_QUERIES_PER_TASK: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -c constraints.txt
      - name: Train a tiny model for the smoke test
        run: |
          python pipelines/build_dataset.py --synthetic --synthetic-users 800
          python pipelines/train.py --version smoke --max-eval-cases 150
          python pipelines/evaluate.py --version smoke --error-cases 2
          python pipelines/publish.py --version smoke
      - name: Build image
        run: docker build -f infra/Dockerfile -t crossverse:ci .
      - name: Smoke-test API container
        run: |
          chmod -R a+rwX artifacts   # container runs as uid 1000; SQLite log lives in the mounted dir
          docker run -d --name cv -p 8000:8000 -v "$PWD/artifacts:/app/artifacts" -e CROSSVERSE_ARTIFACTS_DIR=/app/artifacts crossverse:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          python scripts/smoke_test.py --url http://localhost:8000
          docker logs cv | tail -20
